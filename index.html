<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabla de Tipos Karmacraft</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Raleway:wght@300;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="stars-wrapper">
      <div id="stars"></div>
      <div id="stars2"></div>
      <div id="stars3"></div>
    </div>

    <div id="app-content">
      <div class="section-toggle-bar">
        <button
          id="sec-btn-daños"
          class="section-tab active"
          onclick="switchSection('daños')"
        >
          Tabla de Daños
        </button>
        <button
          id="sec-btn-sinergias"
          class="section-tab"
          onclick="switchSection('sinergias')"
        >
          Tabla de Sinergias
        </button>
        <!--
        <button
          id="sec-btn-entornos"
          class="section-tab"
          onclick="switchSection('entornos')"
        >
          Entornos Mágicos
        </button>
        -->
      </div>

      <div id="section-daños" class="main-section active-section">
        <h1>Tabla de Daños</h1>

        <div class="view-controls" id="main-controls">
          <button
            class="toggle-btn active"
            onclick="switchView('chart', this, 'main-controls', 'main-views')"
          >
            Gráfico Cósmico
          </button>
          <button
            class="toggle-btn"
            onclick="switchView('matrix', this, 'main-controls', 'main-views')"
          >
            Matriz Clásica
          </button>
          <button
            class="toggle-btn"
            onclick="switchView('versus', this, 'main-controls', 'main-views')"
          >
            Modo Versus
          </button>
          <button
            class="toggle-btn"
            onclick="switchView('cards', this, 'main-controls', 'main-views')"
          >
            Tarjetas de Elemento
          </button>
        </div>

        <div id="main-views">
          <div id="view-chart" class="view-container active">
            <div class="chart-container" id="chart">
              <svg
                class="chart-layer"
                id="lines-layer"
                viewBox="0 0 1000 1000"
                preserveAspectRatio="xMidYMid meet"
              ></svg>
            </div>
            <div class="chart-legend">
              <div class="legend-item">
                <div class="legend-line solid"></div>
                <span><strong>Fuerte contra</strong> (1.5x daño)</span>
              </div>
              <div class="legend-item">
                <div class="legend-line dashed"></div>
                <span><strong>Débil contra</strong> (Recibe 1.5x)</span>
              </div>
            </div>
            <div class="mobile-icons-legend" id="mobile-legend"></div>
          </div>

          <div id="view-matrix" class="view-container">
            <div class="matrix-wrapper">
              <table class="type-matrix" id="matrix-table"></table>
            </div>
          </div>

          <div id="view-versus" class="view-container">
            <div class="versus-calculator">
              <div class="calc-group">
                <label>ATACANTE</label>
                <select class="calc-select" id="calc-attacker"></select>
              </div>
              <div class="calc-group" style="align-items: center">
                <svg
                  viewBox="0 0 24 24"
                  width="28"
                  height="28"
                  style="color: #aaa"
                >
                  <path
                    fill="currentColor"
                    d="M11 2L6 7H10V17H6L11 22L16 17H12V7H16L11 2Z"
                  />
                </svg>
              </div>
              <div class="calc-group">
                <label>DEFENSOR</label>
                <select class="calc-select" id="calc-defender"></select>
              </div>
              <div class="calc-result-box" id="calc-result">
                <div class="calc-result-number" id="calc-num">1x</div>
                <div class="calc-result-text" id="calc-txt">Daño Neutro</div>
              </div>
            </div>
          </div>

          <div id="view-cards" class="view-container">
            <div class="cards-grid" id="cards-wrapper"></div>
          </div>
        </div>
      </div>

      <div id="section-sinergias" class="main-section">
        <h1 class="section-title">Tabla de Sinergias</h1>

        <div class="view-controls" id="compat-controls">
          <button
            class="toggle-btn active"
            onclick="
              switchView(
                'compat-chart',
                this,
                'compat-controls',
                'compat-views',
              )
            "
          >
            Gráfico Cósmico
          </button>
          <button
            class="toggle-btn"
            onclick="
              switchView(
                'compat-matrix',
                this,
                'compat-controls',
                'compat-views',
              )
            "
          >
            Matriz Clásica
          </button>
          <button
            class="toggle-btn"
            onclick="
              switchView(
                'compat-versus',
                this,
                'compat-controls',
                'compat-views',
              )
            "
          >
            Modo Versus
          </button>
          <button
            class="toggle-btn"
            onclick="
              switchView(
                'compat-cards',
                this,
                'compat-controls',
                'compat-views',
              )
            "
          >
            Tarjetas de Sinergia
          </button>
        </div>

        <div id="compat-views">
          <div
            id="view-compat-chart"
            class="view-container active"
            style="max-width: 900px; margin: 0 auto"
          >
            <div class="chart-container" id="compat-chart">
              <svg
                class="chart-layer"
                id="compat-lines-layer"
                viewBox="0 0 1000 1000"
                preserveAspectRatio="xMidYMid meet"
              ></svg>
            </div>
            <div class="chart-legend">
              <div class="legend-item">
                <div
                  class="legend-line solid"
                  style="background: #2ecc71"
                ></div>
                <span><strong>Sinergias Equilibradas</strong> — Daño x2</span>
              </div>
              <div class="legend-item">
                <div
                  class="legend-line"
                  style="
                    background: transparent;
                    border-top: 3px dashed #f39c12;
                    opacity: 1;
                  "
                ></div>
                <span><strong>Sinergias Polarizadas</strong> — Daño x4</span>
              </div>
              <div class="legend-item">
                <div
                  class="legend-line"
                  style="
                    background: transparent;
                    border-top: 3px dashed #e74c3c;
                    opacity: 1;
                  "
                ></div>
                <span><strong>Sinergias Inestables</strong> — Daño x4</span>
              </div>
            </div>
            <div class="mobile-icons-legend" id="mobile-legend-compat"></div>
          </div>

          <div id="view-compat-matrix" class="view-container">
            <div class="matrix-wrapper">
              <table class="type-matrix" id="compat-matrix-table"></table>
            </div>
          </div>

          <div id="view-compat-versus" class="view-container">
            <div class="versus-calculator" style="max-width: 550px">
              <div class="calc-group">
                <label>TIPO A</label>
                <select class="calc-select" id="compat-select-a"></select>
              </div>
              <div class="calc-group" style="align-items: center">
                <svg
                  viewBox="0 0 24 24"
                  width="28"
                  height="28"
                  style="color: #aaa"
                >
                  <path
                    fill="currentColor"
                    d="M19 8l-4 4h3c0 3.31-2.69 6-6 6a5.87 5.87 0 01-2.8-.7l-1.46 1.46C8.97 19.54 10.43 20 12 20c4.42 0 8-3.58 8-8h3l-4-4zM6 12c0-3.31 2.69-6 6-6 1.01 0 1.96.25 2.8.7l1.46-1.46A7.93 7.93 0 0012 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"
                  />
                </svg>
              </div>
              <div class="calc-group">
                <label>TIPO B</label>
                <select class="calc-select" id="compat-select-b"></select>
              </div>
              <div
                class="calc-result-box compat-versus-result"
                id="compat-result"
              >
                <div class="calc-result-number" id="compat-result-icon">—</div>
                <div class="calc-result-text" id="compat-result-title">
                  Sin datos de sinergia
                </div>
                <div class="compat-result-desc" id="compat-result-desc"></div>
              </div>
            </div>
          </div>

          <div id="view-compat-cards" class="view-container">
            <div class="syn-cards-wrapper" id="compat-cards-wrapper"></div>
          </div>
        </div>
      </div>

      <div id="section-entornos" class="main-section">
        <h1 class="section-title">Entornos Mágicos</h1>

        <div class="view-controls" id="env-controls">
          <button
            class="toggle-btn active"
            onclick="switchView('env-catalog', this, 'env-controls', 'env-views')"
          >
            Catálogo
          </button>
          <button
            class="toggle-btn"
            onclick="switchView('env-matrix', this, 'env-controls', 'env-views')"
          >
            Matriz de Magos
          </button>
          <button
            class="toggle-btn"
            onclick="switchView('env-resistances', this, 'env-controls', 'env-views')"
          >
            Resistencias
          </button>
          <button
            class="toggle-btn"
            onclick="switchView('env-versus', this, 'env-controls', 'env-views')"
          >
            Modo Versus
          </button>
          <button
            class="toggle-btn"
            onclick="switchView('env-guide', this, 'env-controls', 'env-views')"
          >
            Diseño y Balance
          </button>
        </div>

        <div id="env-views">
          <div id="view-env-catalog" class="view-container active">
            <div class="env-priority-tree" id="env-priority-tree"></div>
            <div class="env-catalog-grid" id="env-catalog-grid"></div>
          </div>

          <div id="view-env-matrix" class="view-container">
            <div class="matrix-wrapper">
              <table class="type-matrix" id="env-matrix-table"></table>
            </div>
            <div class="chart-legend" id="env-matrix-legend"></div>
          </div>

          <div id="view-env-resistances" class="view-container">
            <div class="env-resistances-wrapper" id="env-resistances-wrapper"></div>
          </div>

          <div id="view-env-versus" class="view-container">
            <div class="versus-calculator" style="max-width: 650px; margin: 0 auto;">
              <div class="calc-group">
                <label>CLASE / ELEMENTO</label>
                <select class="calc-select" id="env-versus-player"></select>
              </div>
              <div class="calc-group" style="align-items: center">
                <svg viewBox="0 0 24 24" width="28" height="28" style="color: #aaa">
                  <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                </svg>
              </div>
              <div class="calc-group">
                <label>ENTORNO ACTIVO</label>
                <select class="calc-select" id="env-versus-location"></select>
              </div>
              <div class="calc-result-box" id="env-versus-result" style="display: block; text-align: left; padding: 20px; min-height: auto; width: 100%; box-sizing: border-box;">
                <h4 style="margin: 0 0 15px 0; font-family: 'Cinzel', serif; font-size: 1.2em; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px;">Resumen del Impacto Ambiental</h4>
                <div id="env-versus-content"></div>
              </div>
            </div>
          </div>

          <div id="view-env-guide" class="view-container">
            <div class="env-guide-wrapper" id="env-guide-wrapper"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
